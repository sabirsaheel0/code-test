<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ball Press</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <h1>Ball Press</h1>

      <section class="button-grid" aria-label="Ball press controls">
        <button class="press-button mode-button" data-mode="lock" type="button">Lock</button>
        <button class="press-button mode-button" data-mode="unlock" type="button">Unlock</button>

        <button class="press-button ball-button" data-ball="1" type="button">1</button>
        <button class="press-button ball-button" data-ball="2" type="button">2</button>
        <button class="press-button ball-button" data-ball="3" type="button">3</button>
        <button class="press-button ball-button" data-ball="4" type="button">4</button>
        <button class="press-button ball-button" data-ball="5" type="button">5</button>
        <button class="press-button ball-button" data-ball="6" type="button">6</button>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
